<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07111f">
    <title>PulseRank - Gym Progress Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5a1 1 0 0 1-1-1v-4.5h-3V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9.5Z" fill="currentColor"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><path d="M10.5 4a6.5 6.5 0 1 0 4.15 11.53l4.4 4.4a1 1 0 0 0 1.41-1.42l-4.4-4.4A6.5 6.5 0 0 0 10.5 4Zm0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z" fill="currentColor"/></symbol>
        <symbol id="icon-barbell" viewBox="0 0 24 24"><path d="M6 7h2v10H6zm10 0h2v10h-2zM3 9h2v6H3zm16 0h2v6h-2zM9 10h6v4H9z" fill="currentColor"/></symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19a1 1 0 0 1-1-1V6a1 1 0 1 1 2 0v11h15a1 1 0 1 1 0 2H4Zm4-3.5a1 1 0 0 1-.7-1.71l2.6-2.6a1 1 0 0 1 1.4 0l1.3 1.3 4.1-4.1a1 1 0 0 1 1.4 1.4l-4.8 4.8a1 1 0 0 1-1.4 0l-1.3-1.3-1.9 1.9a1 1 0 0 1-.7.3Z" fill="currentColor"/></symbol>
        <symbol id="icon-user" viewBox="0 0 24 24"><path d="M12 12.2a4.6 4.6 0 1 0 0-9.2 4.6 4.6 0 0 0 0 9.2ZM4 20a8 8 0 0 1 16 0 1 1 0 1 1-2 0 6 6 0 0 0-12 0 1 1 0 1 1-2 0Z" fill="currentColor"/></symbol>
        <symbol id="icon-flame" viewBox="0 0 24 24"><path d="M12.7 2.4c.3 2.5-1 3.8-2.2 5-.9.9-1.8 1.8-1.8 3.5 0 1.4.8 2.4 2 3 .1-1.4.7-2.4 1.6-3.3 1.2-1.2 2.9-2.4 3-5.9 2 2.1 4 4.6 4 8 0 4.4-3.6 7.7-8 7.7S3.3 17.1 3.3 12.9c0-3.2 2.1-5.9 4.8-7.7.3 1.8 1.2 2.8 2.2 3.7 1.1-1.3 1.8-3 2.4-6.5Z" fill="currentColor"/></symbol>
        <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M7 4h10v2h2a1 1 0 0 1 1 1c0 2.7-1.7 4.9-4.1 5.9A6 6 0 0 1 13 17v2h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2a6 6 0 0 1-2.9-4.1C5.7 11.9 4 9.7 4 7a1 1 0 0 1 1-1h2V4Zm10 4V6H7v2c0 1.9 1.2 3.6 3 4.2V12h4v.2c1.8-.6 3-2.3 3-4.2Z" fill="currentColor"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z" fill="currentColor"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2Zm1 5a1 1 0 1 0-2 0v4.4c0 .4.2.8.5 1l3 2a1 1 0 1 0 1.1-1.7L13 10.9V7Z" fill="currentColor"/></symbol>
        <symbol id="icon-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.7-9.6-9.6A5.9 5.9 0 0 1 12 4.5a5.9 5.9 0 0 1 9.6 6.9C19.5 16.3 12 21 12 21Z" fill="currentColor"/></symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24"><path d="M7 11V8a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-6a2 2 0 0 1 2-2h1Zm2 0h6V8a3 3 0 1 0-6 0v3Z" fill="currentColor"/></symbol>
        <symbol id="icon-mail" viewBox="0 0 24 24"><path d="M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Zm0 2v.2l8 5 8-5V8H4Zm16 8V10l-8 5-8-5v6h16Z" fill="currentColor"/></symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 2 20 5v6c0 5-3.4 8.9-8 11-4.6-2.1-8-6-8-11V5l8-3Zm0 2.2L6 6.3V11c0 4.1 2.7 7.1 6 8.8 3.3-1.7 6-4.7 6-8.8V6.3l-6-2.1Z" fill="currentColor"/></symbol>
        <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2l1.7 5.2L19 9l-5.3 1.8L12 16l-1.7-5.2L5 9l5.3-1.8L12 2Zm6 9 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" fill="currentColor"/></symbol>
    </svg>

    <div class="bg-orb orb-a"></div>
    <div class="bg-orb orb-b"></div>
    <div class="bg-grid"></div>

    <div id="app-shell" class="app-shell">
        <header class="app-header">
            <button class="brand-pill" type="button" data-action="go-dashboard">
                <span class="brand-mark">P</span>
                <span>
                    <strong>PulseRank</strong>
                    <small>Gym progress, ranked</small>
                </span>
            </button>
            <div class="header-meta" id="header-meta"></div>
        </header>

        <main id="screen-root" class="screen-root" aria-live="polite"></main>

        <nav class="bottom-nav" aria-label="Primary">
            <button type="button" class="nav-item active" data-view="dashboard"><svg class="nav-icon"><use href="#icon-home"></use></svg><span>Home</span></button>
            <button type="button" class="nav-item" data-view="library"><svg class="nav-icon"><use href="#icon-search"></use></svg><span>Library</span></button>
            <button type="button" class="nav-item nav-item--primary" data-view="workout"><svg class="nav-icon"><use href="#icon-plus"></use></svg></button>
            <button type="button" class="nav-item" data-view="history"><svg class="nav-icon"><use href="#icon-chart"></use></svg><span>History</span></button>
            <button type="button" class="nav-item" data-view="profile"><svg class="nav-icon"><use href="#icon-user"></use></svg><span>Profile</span></button>
        </nav>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
